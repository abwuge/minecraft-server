name: mcnet

x-common-env: &common-env
  VELOCITY_FORWARDING_SECRET: ${VELOCITY_FORWARDING_SECRET}
  RCON_PASSWORD: ${RCON_PASSWORD}
  ONLINE_MODE: ${ONLINE_MODE:-true}
  WHITE_LIST: ${WHITE_LIST:-${ONLINE_MODE:-true}}

services:
  proxy:
    image: ${IMAGE_PROXY:-ghcr.io/${GHCR_OWNER:-abwuge}/mc-proxy:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: proxy/Dockerfile
    container_name: mcnet-proxy
    restart: unless-stopped
    environment:
      <<: *common-env
      XMS: 512M
      XMX: 1G
      MOTD_PROXY: ${MOTD_PROXY}
    ports:
      - "${PROXY_PORT:-25565}:25565/tcp"
      - "${BEDROCK_PORT:-19132}:19132/udp"
    volumes:
      - ./data/proxy:/data
      - ./data/whitelist:/whitelist
    networks: [mcnet]
    stdin_open: true
    tty: true
    depends_on:
      main:
        condition: service_healthy
      mirror:
        condition: service_healthy
      create:
        condition: service_healthy

  main:
    image: ${IMAGE_MAIN:-ghcr.io/${GHCR_OWNER:-abwuge}/mc-main:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: shared/Dockerfile.server
      args:
        BASE_IMAGE: ghcr.io/${GHCR_OWNER:-abwuge}/mc-base:latest
        SERVER_NAME: main
    container_name: mcnet-main
    restart: unless-stopped
    environment:
      <<: *common-env
      XMS: ${MAIN_XMS:-2G}
      XMX: ${MAIN_XMX:-6G}
      MOTD_SERVER: "§amain §7- 主生电世界"
    volumes:
      - ./data/main:/data
      - ./data/whitelist:/whitelist
    networks: [mcnet]
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/25575' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  mirror:
    image: ${IMAGE_MIRROR:-ghcr.io/${GHCR_OWNER:-abwuge}/mc-mirror:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: shared/Dockerfile.server
      args:
        BASE_IMAGE: ghcr.io/${GHCR_OWNER:-abwuge}/mc-base:latest
        SERVER_NAME: mirror
    container_name: mcnet-mirror
    restart: unless-stopped
    environment:
      <<: *common-env
      XMS: ${MIRROR_XMS:-1G}
      XMX: ${MIRROR_XMX:-3G}
      MOTD_SERVER: "§emirror §7- 镜像服"
    volumes:
      - ./data/mirror:/data
      - ./data/whitelist:/whitelist
    networks: [mcnet]
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/25575' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  create:
    image: ${IMAGE_CREATE:-ghcr.io/${GHCR_OWNER:-abwuge}/mc-create:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: shared/Dockerfile.server
      args:
        BASE_IMAGE: ghcr.io/${GHCR_OWNER:-abwuge}/mc-base:latest
        SERVER_NAME: create
    container_name: mcnet-create
    restart: unless-stopped
    environment:
      <<: *common-env
      XMS: ${CREATE_XMS:-1G}
      XMX: ${CREATE_XMX:-3G}
      MOTD_SERVER: "§dcreate §7- 超平坦试验场"
    volumes:
      - ./data/create:/data
      - ./data/whitelist:/whitelist
    networks: [mcnet]
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/25575' 2>/dev/null"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 30

  mcsm-web:
    image: ${IMAGE_MCSM_WEB:-ghcr.io/${GHCR_OWNER:-abwuge}/mc-mcsm-web:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: mcsm/Dockerfile.web
    container_name: mcnet-mcsm-web
    restart: unless-stopped
    environment:
      MCSM_PUBLIC_URL: ${MCSM_PUBLIC_URL:-}
      MCSM_NODE_ADDRESS: ${MCSM_NODE_ADDRESS:-}
      MCSM_DAEMON_PORT: ${MCSM_DAEMON_PORT:-24444}
      MCSM_ADMIN_USER: ${MCSM_ADMIN_USER:-admin}
      MCSM_ADMIN_PASSWORD: ${MCSM_ADMIN_PASSWORD:-}
    ports:
      - "${MCSM_WEB_PORT:-23333}:23333"
    volumes:
      - ./data/mcsm/web/data:/opt/mcsmanager/web/data
      - ./data/mcsm/web/logs:/opt/mcsmanager/web/logs
      - ./data/mcsm/web/upload_files:/opt/mcsmanager/web/public/upload_files
      - ./data/mcsm/daemon/data:/mcnet-daemon-data:ro
    networks: [mcnet]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      mcsm-daemon:
        condition: service_healthy

  mcsm-daemon:
    image: ${IMAGE_MCSM_DAEMON:-ghcr.io/${GHCR_OWNER:-abwuge}/mc-mcsm-daemon:${IMAGE_TAG:-latest}}
    build:
      context: .
      dockerfile: mcsm/Dockerfile.daemon
    container_name: mcnet-mcsm-daemon
    restart: unless-stopped
    environment:
      MCSM_DOCKER_WORKSPACE_PATH: ${MCSM_DOCKER_WORKSPACE_PATH:-}
    ports:
      - "${MCSM_DAEMON_PORT:-24444}:24444"
    volumes:
      - ./data/mcsm/daemon/data:/opt/mcsmanager/daemon/data
      - ./data/mcsm/daemon/logs:/opt/mcsmanager/daemon/logs
      - ./data:/mcnet-data
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [mcnet]
    depends_on:
      proxy:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:24444/daemon/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

  gateway:
    image: caddy:2-alpine
    container_name: mcnet-gateway
    restart: unless-stopped
    profiles: [gateway]
    ports:
      - "${GATEWAY_PORT:-1080}:80"
    volumes:
      - ./config/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/gateway/data:/data
      - ./data/gateway/config:/config
    networks: [mcnet]
    depends_on:
      - mcsm-web

networks:
  mcnet:
    driver: bridge
